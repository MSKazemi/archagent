services:
  archagent:
    build: .
    image: archagent-buildingos:local
    environment:
      ARCHAGENT_TOKEN: ${ARCHAGENT_TOKEN:?Set ARCHAGENT_TOKEN before running docker compose}
      ARCHAGENT_HOST: 0.0.0.0
      ARCHAGENT_PORT: 8091
      ARCHAGENT_HEALTH_HOST: 127.0.0.1
    expose:
      - "8091"
    volumes:
      - ./:/app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - archagent
    restart: unless-stopped
